# PrusaSlicer 2.7 config reproducing OrcaSlicer's official
# "Flashforge Adventurer 3 Series 0.4 Nozzle" machine profile and
# "0.20mm Standard @Flashforge AD3 0.4 Nozzle" process profile
# (OrcaSlicer resources/profiles/Flashforge, fetched 2026-10-23),
# plus the "Flashforge PETG @FF AD3" cooling limits (slowdown 8 s, min 30 mm/s);
# nozzle 240 C because the Adventurer 3 Lite tops out at 240 C (Orca lists 245).
# Used ONLY for time/material estimation - slice the STLs yourself in FlashPrint/Orca.
printer_technology = FFF
bed_shape = 0x0,150x0,150x150,0x150
max_print_height = 150
nozzle_diameter = 0.4
gcode_flavor = marlin2
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 500
machine_max_acceleration_extruding = 500
machine_max_acceleration_retracting = 500
machine_max_acceleration_travel = 500
machine_max_acceleration_x = 500
machine_max_acceleration_y = 500
machine_max_acceleration_z = 100
machine_max_feedrate_e = 30
machine_max_feedrate_x = 150
machine_max_feedrate_y = 150
machine_max_feedrate_z = 20
machine_max_jerk_e = 2.5
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
retract_length = 5
retract_speed = 25
deretract_speed = 25
retract_lift = 0.4
retract_before_travel = 1
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
top_solid_min_thickness = 1
bottom_solid_min_thickness = 0
fill_density = 15%
fill_pattern = rectilinear
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
extrusion_width = 0.4
first_layer_extrusion_width = 0.4
perimeter_extrusion_width = 0.4
external_perimeter_extrusion_width = 0.4
infill_extrusion_width = 0.4
solid_infill_extrusion_width = 0.4
top_infill_extrusion_width = 0.4
perimeter_speed = 42
external_perimeter_speed = 30
small_perimeter_speed = 50%
infill_speed = 60
solid_infill_speed = 30
top_solid_infill_speed = 30
gap_fill_speed = 30
bridge_speed = 25
travel_speed = 80
first_layer_speed = 10
default_acceleration = 150
perimeter_acceleration = 100
external_perimeter_acceleration = 100
infill_acceleration = 150
solid_infill_acceleration = 100
top_solid_infill_acceleration = 50
bridge_acceleration = 100
first_layer_acceleration = 50
travel_acceleration = 150
skirts = 2
skirt_distance = 5
skirt_height = 1
brim_width = 0
elefant_foot_compensation = 0.15
support_material = 0
cooling = 1
slowdown_below_layer_time = 8
min_print_speed = 30
fan_below_layer_time = 30
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 20
filament_type = PETG
extrusion_multiplier = 1
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
complete_objects = 0
# Orca fdm_process_flashforge_common: reduce_infill_retraction=1, minimum_sparse_infill_area=15
# AD3 process: reduce_crossing_wall=1, max_travel_detour_distance=50
only_retract_when_crossing_perimeters = 1
solid_infill_below_area = 15
avoid_crossing_perimeters = 1
avoid_crossing_perimeters_max_detour = 50
